name: baraza-tests

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: baraza_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: baraza_test
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "baraza_test", "-d", "baraza_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
