name: Bug report
description: Report something that does not work
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: markdown
    attributes:
      value: "⚠️ Do not attach any transcript or real data."
